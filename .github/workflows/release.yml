# SPDX-License-Identifier: AGPL-3.0-only

# A release: a tag by date (YY.0M.N), on a commit of main whose CI passed
# (checked), naming the release VERSION says. It publishes every image the
# self-host stack runs to GitHub's registry (amd64), tagged with the release
# and latest, with provenance and an SBOM, each signed keylessly (cosign,
# with this workflow's GitHub identity) and its build attested, then drafts
# the GitHub release, which names the web chat's release it ships with.
# Actions are pinned to a commit: a tag moved upstream can't change what
# runs with the right to publish. docs/development.md#releases.
# Run by hand, it rehearses one: it builds every image of the release
# VERSION names, and publishes nothing.
name: release

on:
  push:
    tags: ["[0-9][0-9].[0-9][0-9].[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      chat-release: ${{ steps.release.outputs.chat }}
      chat-commit: ${{ steps.chat.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # main's history, to find the tag's commit on it
      - name: the tag is the release VERSION names
        id: release
        run: |
          version=$(cat VERSION)
          if [ "$GITHUB_EVENT_NAME" = push ] && { ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^[0-9]{2}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$' || [ "$GITHUB_REF_NAME" != "$version" ]; }; then
            echo "::error::the tag is $GITHUB_REF_NAME, and VERSION says $version: tag the release VERSION names"
            exit 1
          fi
          echo "release=$version" >> "$GITHUB_OUTPUT"
          echo "chat=$(cat deploy/platform/chat-release)" >> "$GITHUB_OUTPUT"
      - name: the tag is a commit of main whose CI passed
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't a commit of main"
            exit 1
          fi
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI hasn't passed on $GITHUB_SHA: wait for it, or fix it, then tag again"
            exit 1
          fi
      - name: the web chat's release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: guildnet-chat/guildnet-chat
          ref: ${{ steps.release.outputs.chat }}
          path: chat
      - id: chat
        run: echo "commit=$(git -C chat rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  images:
    needs: check
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      # Keyless signing and attestations: the workflow's own GitHub identity.
      id-token: write
      attestations: write
    strategy:
      matrix:
        # Each image, built as deploy/selfhost/compose.yml builds it: from
        # deploy/<image>/Dockerfile, in this context (the repo's root for
        # the Go programs).
        include:
          - {image: platform, context: .}
          - {image: runner, context: .}
          - {image: sandboxd, context: .}
          - {image: desk, context: deploy/desk}
          - {image: ergo, context: deploy/ergo}
          - {image: caddy, context: deploy/caddy}
          - {image: postgres, context: deploy/postgres}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: guildnet
      # The console's image builds the web chat in.
      - if: matrix.image == 'platform'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: guildnet-chat/guildnet-chat
          ref: ${{ needs.check.outputs.chat-commit }}
          path: chat
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: guildnet/${{ matrix.context }}
          file: guildnet/deploy/${{ matrix.image }}/Dockerfile
          build-contexts: ${{ matrix.image == 'platform' && 'chat-src=chat' || '' }}
          build-args: |
            GUILDNET_RELEASE=${{ needs.check.outputs.release }}
            GUILDNET_CHAT_COMMIT=${{ needs.check.outputs.chat-commit }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.release }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/guildnet-chat/${{ matrix.image }}:${{ needs.check.outputs.release }}
            ghcr.io/guildnet-chat/${{ matrix.image }}:latest
      # Signed by digest, keylessly: `cosign verify` checks it was this
      # repo's release workflow (docs/self-host/security.md).
      - if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign the image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/guildnet-chat/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/guildnet-chat/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [check, images]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          CHAT_RELEASE: ${{ needs.check.outputs.chat-release }}
          CHAT_COMMIT: ${{ needs.check.outputs.chat-commit }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --generate-notes --notes "$(cat <<EOF
          Web chat: [guildnet-chat $CHAT_RELEASE](https://github.com/guildnet-chat/guildnet-chat/releases/tag/$CHAT_RELEASE) ($CHAT_COMMIT).

          Images (linux/amd64): \`ghcr.io/guildnet-chat/{platform,runner,sandboxd,desk,ergo,caddy,postgres}:$GITHUB_REF_NAME\`.
          Installing: [docs/self-host/install.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/self-host/install.md). Upgrading: [docs/self-host/operations.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/self-host/operations.md#upgrading).
          EOF
          )"
