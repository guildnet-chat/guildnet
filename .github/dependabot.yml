# The images' bases are pinned by digest, the actions and Go modules by
# version: Dependabot proposes updates weekly, each checked by CI.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /deploy/caddy
      - /deploy/desk
      - /deploy/ergo
      - /deploy/platform
      - /deploy/postgres
      - /deploy/runner
      - /deploy/sandboxd
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
